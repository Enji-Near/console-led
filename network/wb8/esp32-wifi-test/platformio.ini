; Acceptance test for the WB8 Console-Net AP: an ESP32 (2.4 GHz only) joins
; Console-Net and reports AP, channel, signal, DNS and internet over serial.
; Same platform as console-led/firmware so nothing new is downloaded.

[env:esp32dev]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.06.00/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
