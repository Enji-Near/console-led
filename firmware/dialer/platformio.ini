; Dialer proof of concept: rotary phone -> ESP-NOW -> Glorious-Hole (stock WLED 16) presets.
;   cd firmware/dialer && pio run -t upload --upload-port /dev/ttyUSB5 && pio device monitor -p /dev/ttyUSB5
; Same platform as the old WLED 16.0.1 build, so nothing new to download.
[env:dialer]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.06.00/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
