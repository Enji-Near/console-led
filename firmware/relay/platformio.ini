; Relay: passes Dialer presses on to Glorious-Hole over ESP-NOW (a first "courier" node).
;   cd firmware/relay && pio run -t upload --upload-port /dev/ttyUSB4
; Same platform as the old WLED 16.0.1 build, so nothing new to download.
[env:relay]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.06.00/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
